<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: #FFBDBD;
  text-align: center;
}

h1 {
  margin-top: 30px;
  color: #5A3E3E;
}

.form-container {
  background: white;
  width: 350px;
  margin: 40px auto;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

iframe {
  width: 100%;
  height: 500px;
  border: none;
  border-radius: 15px;
}

.back-btn {
  display: inline-block;
  background: linear-gradient(45deg,#FF6F91,#6A5ACD);
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 30px;
}

.back-btn:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>Contact Me 💌</h1>

<div class="form-container">

  <iframe
    src="https://docs.google.com/forms/d/e/1FAIpQLSdAxzx7hw4PrvGslzKDAmz5fzrmofBUH9Hs_fnLGl9OFuE1gg/viewform?embedded=true">
  </iframe>

</div>

<a href="index.html" class="back-btn">
  🏠 Back to Home
</a>

</body>
</html>
