<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #FFBDBD;
  text-align: center;
  color: #5A3E3E;
}

/* Navbar */
.navbar {
  background: #FF9AA2;
  padding: 15px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin: 0 15px;
  font-weight: bold;
}

/* Page Title */
h1 {
  margin-top: 50px;
  font-size: 36px;
}

/* Cards Section */
.section {
  padding: 40px 20px;
}

/* Card Style */
.card {
  background: white;
  width: 260px;
  padding: 25px;
  margin: 20px;
  display: inline-block;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
}

/* Cute Button */
.cute-btn {
  background: linear-gradient(45deg, #FF6F91, #6A5ACD);
  color: white;
  padding: 10px 22px;
  border-radius: 25px;
  text-decoration: none;
  display: inline-block;
  margin-top: 15px;
  transition: 0.3s;
}

.cute-btn:hover {
  transform: scale(1.1);
}

/* Responsive */
@media (max-width: 600px) {
  .card {
    width: 90%;
  }
}
</style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="explore.html">Explore</a>
  <a href="contact.html">Contact</a>
</div>

<h1>Explore what's in here :) 🌸</h1>
<h1> Here you have three tabs to enter.</h1>

<div class="section">

  <div class="card">
    <h3>What you mean to me 🦄</h3>
    <p>Few droplets from the ocean I hold:)</p>
    <a href="design.html" class="cute-btn">Open</a>
  </div>

  <div class="card">
    <h3>Birthday letter ❤️</h3>
    <p>Wishing You Happiest Birthday.</p>
    <a href="style.html" class="cute-btn">Open</a>
  </div>

  <div class="card">
    <h3>💌 Contact</h3>
    <p>In case if you wanna say.</p>
    <a href="contact.html" class="cute-btn">Open</a>
  </div>

</div>

</body>
</html>
